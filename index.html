<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشاورین املاک قدس (کریمی)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0f172a', 900: '#0a0f1d' },
                        gold: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen pb-12 text-gray-800">

    <!-- Header -->
    <header class="bg-navy-900 text-white shadow-xl border-b-2 border-gold-500 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div id="logo-btn" onclick="handleLogoClick()" class="cursor-pointer select-none flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 bg-gold-500 text-navy-900 rounded-full flex items-center justify-center font-bold text-xl border-2 border-gold-400">
                    ق
                </div>
                <div>
                    <h1 class="text-xl font-black text-gold-400 tracking-wide">املاک قدس</h1>
                    <p class="text-xs text-gold-500 font-semibold">مدیریت: کریمی</p>
                </div>
            </div>
            <button id="admin-badge" onclick="logoutAdmin()" class="hidden bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-bold shadow hover:bg-red-700 transition">
                خروج از مدیریت <i class="fas fa-sign-out-alt mr-1"></i>
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="max-w-4xl mx-auto px-4 mt-6">
        <div class="grid grid-cols-3 gap-2 bg-navy-800 p-1.5 rounded-2xl shadow-md border border-navy-800">
            <button onclick="switchTab('files')" id="tab-files" class="py-2.5 px-2 text-xs md:text-sm font-bold rounded-xl transition-all duration-200 text-navy-900 bg-gold-500 shadow">
                <i class="fas fa-building mb-1 block text-base"></i> فایل‌ها
            </button>
            <button onclick="switchTab('requests')" id="tab-requests" class="py-2.5 px-2 text-xs md:text-sm font-bold rounded-xl transition-all duration-200 text-gray-300 hover:text-white">
                <i class="fas fa-clipboard-list mb-1 block text-base"></i> درخواست‌ها
            </button>
            <button onclick="switchTab('register')" id="tab-register" class="py-2.5 px-2 text-xs md:text-sm font-bold rounded-xl transition-all duration-200 text-gray-300 hover:text-white">
                <i class="fas fa-plus-circle mb-1 block text-base"></i> ثبت آگهی/درخواست
            </button>
        </div>
    </div>

    <!-- Admin Search & Tools Panel -->
    <div id="admin-tools" class="hidden max-w-4xl mx-auto px-4 mt-4">
        <div class="bg-navy-800 text-white p-4 rounded-2xl border border-gold-500/30 shadow-lg">
            <div class="flex items-center justify-between mb-3 border-b border-navy-800 pb-2">
                <span class="text-gold-400 font-bold text-sm"><i class="fas fa-user-shield ml-1"></i> پنل مدیریت فعال است</span>
                <button onclick="exportData()" class="bg-navy-900 border border-gold-500/50 hover:bg-gold-500 hover:text-navy-900 text-gold-400 text-xs px-3 py-1 rounded-lg transition">
                    پشتیبان‌گیری (دانلود فایل) <i class="fas fa-download mr-1"></i>
                </button>
            </div>
            <div class="relative">
                <input type="text" id="admin-search-input" oninput="renderApp()" placeholder="جستجو بر اساس نام مالک/مشتری، منطقه، قیمت، کد..." class="w-full pl-10 pr-4 py-2 bg-navy-900 text-white rounded-xl border border-gold-500/30 text-sm focus:outline-none focus:border-gold-500">
                <i class="fas fa-search absolute left-3 top-2.5 text-gold-500"></i>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- SECTION 1: PUBLIC / ADMIN FILES LIST -->
        <section id="sec-files" class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-navy-900 flex items-center">
                    <i class="fas fa-home text-gold-600 ml-2"></i> فایل‌های املاک ثبت شده
                </h2>
                <span id="files-count" class="text-xs bg-navy-800 text-gold-400 font-bold px-2.5 py-1 rounded-full"></span>
            </div>
            <div id="files-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <!-- SECTION 2: REQUESTS LIST -->
        <section id="sec-requests" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-navy-900 flex items-center">
                    <i class="fas fa-users text-gold-600 ml-2"></i> درخواست‌های مشتریان
                </h2>
                <span id="requests-count" class="text-xs bg-navy-800 text-gold-400 font-bold px-2.5 py-1 rounded-full"></span>
            </div>
            <div id="requests-container" class="space-y-3"></div>
        </section>

        <!-- SECTION 3: REGISTER FORM -->
        <section id="sec-register" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl p-5 border border-gray-200">
                <!-- Registration Toggle (File vs Request) -->
                <div class="flex bg-gray-100 p-1 rounded-xl mb-6">
                    <button onclick="setRegType('file')" id="reg-type-file" class="flex-1 py-2 rounded-lg text-sm font-bold bg-navy-900 text-gold-400 shadow">
                        ثبت فایل ملک
                    </button>
                    <button onclick="setRegType('request')" id="reg-type-request" class="flex-1 py-2 rounded-lg text-sm font-bold text-gray-600">
                        ثبت درخواست مشتری
                    </button>
                </div>

                <!-- Form Dynamic Content -->
                <form id="main-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div id="form-fields"></div>
                    <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-gold-500 to-gold-600 text-navy-900 font-black rounded-xl shadow-lg hover:brightness-105 transition text-base mt-6">
                        ثبت نهایی اطلاعات <i class="fas fa-check-circle mr-1"></i>
                    </button>
                </form>
            </div>
        </section>

    </main>

    <!-- PROPERTY DETAILS MODAL -->
    <div id="details-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="bg-navy-900 text-white p-4 flex justify-between items-center border-b border-gold-500">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span id="modal-code" class="bg-gold-500 text-navy-900 font-black text-xs px-2.5 py-1 rounded-lg"></span>
                    <h3 id="modal-title" class="font-bold text-base text-gold-400"></h3>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto space-y-5 text-sm">
                <!-- Photo Gallery -->
                <div id="modal-gallery-container" class="hidden">
                    <p class="font-bold text-navy-900 mb-2 flex items-center"><i class="fas fa-images text-gold-600 ml-1"></i> تصاویر ملک:</p>
                    <div id="modal-gallery" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
                </div>

                <!-- Property Details Grid -->
                <div id="modal-details-grid" class="grid grid-cols-2 gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200"></div>

                <!-- Features / Remarks -->
                <div id="modal-desc-container" class="hidden bg-amber-50/50 p-3 rounded-xl border border-amber-200/60">
                    <p class="font-bold text-amber-900 mb-1"><i class="fas fa-info-circle ml-1"></i> توضیحات و امکانات تکمیلی:</p>
                    <p id="modal-desc" class="text-gray-700 whitespace-pre-line text-xs leading-relaxed"></p>
                </div>

                <!-- Contact & Map Actions -->
                <div class="pt-2 border-t border-gray-100 flex flex-col gap-2">
                    <a id="modal-call-btn" href="tel:09120000000" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-center shadow flex items-center justify-center gap-2">
                        <i class="fas fa-phone-alt"></i> تماس با دفتر املاک قدس
                    </a>
                    <div id="modal-location-container" class="hidden">
                        <a id="modal-map-btn" target="_blank" href="#" class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs rounded-xl text-center shadow flex items-center justify-center gap-2">
                            <i class="fas fa-map-marker-alt"></i> مسیریابی در نقشه (گوگل مپ/نشان/بلد)
                        </a>
                    </div>
                </div>

                <!-- Admin Exclusive Box -->
                <div id="modal-admin-box" class="hidden bg-red-50 border border-red-200 p-3 rounded-xl text-red-900 space-y-1">
                    <p class="font-bold text-xs text-red-700"><i class="fas fa-lock ml-1"></i> اطلاعات محرمانه (مخصوص مدیر):</p>
                    <p id="modal-admin-owner" class="text-xs"></p>
                    <p id="modal-admin-phone" class="text-xs"></p>
                    <p id="modal-admin-address" class="text-xs"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- LIGHTBOX FOR BIG IMAGE VIEW -->
    <div id="lightbox" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-2" onclick="closeLightbox()">
        <img id="lightbox-img" src="" class="max-w-full max-h-full object-contain rounded-lg">
    </div>

    <!-- JS Logic Application -->
    <script>
        // State Management
        let appState = {
            isAdmin: false,
            activeTab: 'files',
            regType: 'file',
            logoClicks: 0,
            clickTimer: null,
            files: JSON.parse(localStorage.getItem('ag_files') || '[]'),
            requests: JSON.parse(localStorage.getItem('ag_requests') || '[]')
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            buildForm();
        });

        function saveData() {
            localStorage.setItem('ag_files', JSON.stringify(appState.files));
            localStorage.setItem('ag_requests', JSON.stringify(appState.requests));
        }

        function handleLogoClick() {
            appState.logoClicks++;
            clearTimeout(appState.clickTimer);
            appState.clickTimer = setTimeout(() => appState.logoClicks = 0, 2000);

            if (appState.logoClicks >= 5) {
                appState.logoClicks = 0;
                if (!appState.isAdmin) {
                    const pwd = prompt('کد ورود به پنل مدیریت املاک قدس:');
                    if (pwd === 'karimi1731') {
                        appState.isAdmin = true;
                        alert('خوش آمدید مدیریت محترم!');
                        document.getElementById('admin-badge').classList.remove('hidden');
                        document.getElementById('admin-tools').classList.remove('hidden');
                        renderApp();
                    } else if (pwd !== null) {
                        alert('کد ورود اشتباه است.');
                    }
                }
            }
        }

        function logoutAdmin() {
            appState.isAdmin = false;
            document.getElementById('admin-badge').classList.add('hidden');
            document.getElementById('admin-tools').classList.add('hidden');
            renderApp();
        }

        function switchTab(tab) {
            appState.activeTab = tab;
            ['files', 'requests', 'register'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const sec = document.getElementById(`sec-${t}`);
                if (t === tab) {
                    btn.className = "py-2.5 px-2 text-xs md:text-sm font-bold rounded-xl transition-all duration-200 text-navy-900 bg-gold-500 shadow";
                    sec.classList.remove('hidden');
                } else {
                    btn.className = "py-2.5 px-2 text-xs md:text-sm font-bold rounded-xl transition-all duration-200 text-gray-300 hover:text-white";
                    sec.classList.add('hidden');
                }
            });
            renderApp();
        }

        function setRegType(type) {
            appState.regType = type;
            const btnFile = document.getElementById('reg-type-file');
            const btnReq = document.getElementById('reg-type-request');
            if (type === 'file') {
                btnFile.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-navy-900 text-gold-400 shadow";
                btnReq.className = "flex-1 py-2 rounded-lg text-sm font-bold text-gray-600";
            } else {
                btnReq.className = "flex-1 py-2 rounded-lg text-sm font-bold bg-navy-900 text-gold-400 shadow";
                btnFile.className = "flex-1 py-2 rounded-lg text-sm font-bold text-gray-600";
            }
            buildForm();
        }

        function formatCurrencyInput(e) {
            let val = e.value.replace(/,/g, '').replace(/\D/g, '');
            if (val) {
                e.value = Number(val).toLocaleString('en-US');
            } else {
                e.value = '';
            }
        }

        function renderApp() {
            const searchQuery = (document.getElementById('admin-search-input')?.value || '').trim().toLowerCase();

            const filesContainer = document.getElementById('files-container');
            filesContainer.innerHTML = '';
            
            let filteredFiles = appState.files.filter(item => {
                if (!searchQuery) return true;
                return (
                    item.code.toLowerCase().includes(searchQuery) ||
                    (item.region && item.region.toLowerCase().includes(searchQuery)) ||
                    (appState.isAdmin && item.ownerName && item.ownerName.toLowerCase().includes(searchQuery)) ||
                    (item.price && item.price.toString().includes(searchQuery))
                );
            });

            document.getElementById('files-count').innerText = `${filteredFiles.length} مورد`;

            if (filteredFiles.length === 0) {
                filesContainer.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">هیچ فایلی یافت نشد.</div>`;
            } else {
                filteredFiles.forEach(item => {
                    const mainImage = (item.photos && item.photos.length > 0) ? item.photos[0] : 'https://via.placeholder.com/400x250?text=Amlak+Ghods';
                    
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden hover:shadow-lg transition cursor-pointer flex flex-col";
                    card.onclick = () => openModal(item, 'file');

                    card.innerHTML = `
                        <div class="relative h-48 bg-gray-200">
                            <img src="${mainImage}" class="w-full h-full object-cover">
                            <span class="absolute top-3 right-3 bg-navy-900/90 backdrop-blur-md text-gold-400 font-black text-xs px-2.5 py-1 rounded-lg shadow border border-gold-500/30">
                                کد: ${item.code}
                            </span>
                            <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2 py-0.5 rounded-md backdrop-blur-sm">
                                <i class="fas fa-camera ml-1"></i> ${item.photos ? item.photos.length : 0} عکس
                            </span>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-navy-900 text-base">${item.fileCategory} - ${item.subCategory}</h3>
                                    <span class="text-xs bg-gold-500/20 text-gold-600 font-bold px-2 py-0.5 rounded">${item.dealType}</span>
                                </div>
                                <p class="text-xs text-gray-500 mt-1"><i class="fas fa-map-marker-alt text-red-500 ml-1"></i> منطقه: ${item.region || 'مشخص نشده'}</p>
                            </div>
                            
                            <div class="border-t border-gray-100 pt-3 flex justify-between items-center text-xs font-bold text-navy-900">
                                <div>
                                    ${item.price ? `<span class="text-gold-600 text-sm font-black">${item.price}</span> تومان` : ''}
                                    ${item.priceRent ? `<div>رهن: ${item.priceRent}</div>` : ''}
                                    ${item.priceRentVal ? `<div>اجاره: ${item.priceRentVal}</div>` : ''}
                                </div>
                                <span class="text-navy-800 text-[11px] underline">مشاهده جزئیات <i class="fas fa-chevron-left text-[9px]"></i></span>
                            </div>
                        </div>
                    `;
                    filesContainer.appendChild(card);
                });
            }

            const requestsContainer = document.getElementById('requests-container');
            requestsContainer.innerHTML = '';

            let filteredReqs = appState.requests.filter(item => {
                if (!searchQuery) return true;
                return (
                    item.code.toLowerCase().includes(searchQuery) ||
                    (item.region && item.region.toLowerCase().includes(searchQuery)) ||
                    (appState.isAdmin && item.clientName && item.clientName.toLowerCase().includes(searchQuery))
                );
            });

            document.getElementById('requests-count').innerText = `${filteredReqs.length} مورد`;

            if (filteredReqs.length === 0) {
                requestsContainer.innerHTML = `<div class="text-center py-12 text-gray-400">هیچ درخواستی یافت نشد.</div>`;
            } else {
                filteredReqs.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-200 hover:shadow-md transition cursor-pointer flex justify-between items-center";
                    card.onclick = () => openModal(item, 'request');

                    card.innerHTML = `
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2 space-x-reverse">
                                <span class="bg-navy-900 text-gold-400 text-xs font-bold px-2 py-0.5 rounded-md">کد: ${item.code}</span>
                                <h3 class="font-bold text-navy-900 text-sm">درخواست ${item.reqType} (${item.subCategory || 'عام'})</h3>
                            </div>
                            <p class="text-xs text-gray-500"><i class="fas fa-map-marker-alt text-red-500 ml-1"></i> منطقه مورد نظر: ${item.region || 'مهم نیست'}</p>
                            ${item.budget ? `<p class="text-xs font-bold text-gold-600">بودجه: ${item.budget} تومان</p>` : ''}
                        </div>
                        <span class="text-xs bg-navy-800 text-gold-400 px-3 py-1.5 rounded-xl font-bold">مشاهده <i class="fas fa-chevron-left text-[9px] mr-1"></i></span>
                    `;
                    requestsContainer.appendChild(card);
                });
            }
        }

        function buildForm() {
            const container = document.getElementById('form-fields');
            container.innerHTML = '';

            if (appState.regType === 'file') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">نوع معامله (*)</label>
                            <select id="f-deal-type" onchange="updateSubCats()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-gold-500">
                                <option value="فروش">فروش</option>
                                <option value="رهن و اجاره">رهن و اجاره</option>
                                <option value="مشارکت در ساخت">مشارکت در ساخت</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">نوع ملک (*)</label>
                            <select id="f-sub-cat" onchange="renderDynamicFormFields()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-gold-500"></select>
                        </div>
                    </div>
                    <div id="dynamic-file-fields" class="space-y-4 pt-2"></div>
                `;
                updateSubCats();
            } else {
                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">نوع درخواست (*)</label>
                            <select id="r-req-type" onchange="updateReqSubCats()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-gold-500">
                                <option value="خرید">خرید</option>
                                <option value="رهن و اجاره">رهن و اجاره</option>
                                <option value="مشارکت در ساخت">مشارکت در ساخت</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">نوع ملک مورد نظر (*)</label>
                            <select id="r-sub-cat" onchange="renderDynamicReqFields()" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-gold-500"></select>
                        </div>
                    </div>
                    <div id="dynamic-req-fields" class="space-y-4 pt-2"></div>
                `;
                updateReqSubCats();
            }
        }

        function updateSubCats() {
            const dealType = document.getElementById('f-deal-type').value;
            const subCatSelect = document.getElementById('f-sub-cat');
            subCatSelect.innerHTML = '';

            let opts = [];
            if (dealType === 'فروش') {
                opts = ['آپارتمان', 'ویلایی', 'باغ و زمین', 'مغازه تجاری', 'کارگاهی صنعتی'];
            } else if (dealType === 'رهن و اجاره') {
                opts = ['آپارتمان', 'ویلایی', 'مغازه تجاری', 'کارگاهی صنعتی'];
            } else if (dealType === 'مشارکت در ساخت') {
                opts = ['زمین/کلنگی'];
            }

            opts.forEach(o => {
                subCatSelect.innerHTML += `<option value="${o}">${o}</option>`;
            });
            renderDynamicFormFields();
        }

        function updateReqSubCats() {
            const reqType = document.getElementById('r-req-type').value;
            const subCatSelect = document.getElementById('r-sub-cat');
            subCatSelect.innerHTML = '';

            let opts = [];
            if (reqType === 'خرید') {
                opts = ['آپارتمان', 'ویلایی', 'باغ و زمین', 'مغازه تجاری', 'کارگاهی صنعتی'];
            } else if (reqType === 'رهن و اجاره') {
                opts = ['آپارتمان', 'ویلایی', 'مغازه تجاری', 'کارگاهی صنعتی'];
            } else if (reqType === 'مشارکت در ساخت') {
                opts = ['زمین/کلنگی'];
            }

            opts.forEach(o => {
                subCatSelect.innerHTML += `<option value="${o}">${o}</option>`;
            });
            renderDynamicReqFields();
        }

        function renderDynamicFormFields() {
            const dealType = document.getElementById('f-deal-type').value;
            const subCat = document.getElementById('f-sub-cat').value;
            const box = document.getElementById('dynamic-file-fields');
            box.innerHTML = '';

            let fieldsHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200">';

            if (dealType === 'فروش') {
                if (subCat === 'آپارتمان') {
                    fieldsHTML += `

                                <input type="tel" id="r-client-phone" required placeholder="0912..." class="w-full p-2 bg-white border border-gray-300 rounded-lg text-sm">
                            </div>
                        </div>
                    </div>
                </div>
            `;

            box.innerHTML = fieldsHTML;
        }

        let uploadedPhotos = [];
        function handlePhotoUpload(input) {
            uploadedPhotos = [];
            const preview = document.getElementById('photo-preview');
            preview.innerHTML = '';

            const files = Array.from(input.files).slice(0, 5);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedPhotos.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = "w-16 h-16 object-cover rounded-lg border border-gray-300";
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        function generateCode(type) {
            const prefix = type === 'file' ? 'AG' : 'AK';
            const list = type === 'file' ? appState.files : appState.requests;
            const num = list.length + 1;
            return `${prefix}${num < 10 ? '0' + num : num}`;
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            if (appState.regType === 'file') {
                const dealType = document.getElementById('f-deal-type').value;
                const subCat = document.getElementById('f-sub-cat').value;
                const code = generateCode('file');

                const newFile = {
                    id: Date.now(),
                    code: code,
                    dealType: dealType,
                    fileCategory: dealType,
                    subCategory: subCat,
                    region: document.getElementById('f-region')?.value || '',
                    price: document.getElementById('f-price')?.value || '',
                    priceRent: document.getElementById('f-price-rent')?.value || '',
                    priceRentVal: document.getElementById('f-price-rent-val')?.value || '',
                    desc: document.getElementById('f-desc')?.value || '',
                    photos: uploadedPhotos,
                    ownerName: document.getElementById('f-owner-name')?.value || '',
                    ownerPhone: document.getElementById('f-owner-phone')?.value || '',
                    addressExact: document.getElementById('f-address-exact')?.value || '',
                    area: document.getElementById('f-area')?.value || '',
                    floor: document.getElementById('f-floor')?.value || '',
                    rooms: document.getElementById('f-rooms')?.value || ''
                };

                appState.files.unshift(newFile);
                saveData();
                alert(`فایل با موفقیت و با کد اختصاصی ${code} ثبت گردید!`);
                switchTab('files');
            } else {
                const reqType = document.getElementById('r-req-type').value;
                const subCat = document.getElementById('r-sub-cat').value;
                const code = generateCode('request');

                const newReq = {
                    id: Date.now(),
                    code: code,
                    reqType: reqType,
                    subCategory: subCat,
                    region: document.getElementById('r-region')?.value || '',
                    budget: document.getElementById('r-budget')?.value || '',
                    budgetRent: document.getElementById('r-budget-rent')?.value || '',
                    budgetRentVal: document.getElementById('r-budget-rent-val')?.value || '',
                    desc: document.getElementById('r-desc')?.value || '',
                    clientName: document.getElementById('r-client-name')?.value || '',
                    clientPhone: document.getElementById('r-client-phone')?.value || ''
                };

                appState.requests.unshift(newReq);
                saveData();
                alert(`درخواست با موفقیت و با کد اختصاصی ${code} ثبت گردید!`);
                switchTab('requests');
            }
        }

        function openModal(item, type) {
            const modal = document.getElementById('details-modal');
            document.getElementById('modal-code').innerText = `کد آگهی: ${item.code}`;
            document.getElementById('modal-title').innerText = type === 'file' ? `${item.dealType} ${item.subCategory}` : `درخواست ${item.reqType} ${item.subCategory || ''}`;

            const galleryContainer = document.getElementById('modal-gallery-container');
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = '';
            if (type === 'file' && item.photos && item.photos.length > 0) {
                galleryContainer.classList.remove('hidden');
                item.photos.forEach(src => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = "w-full h-24 object-cover rounded-xl border border-gray-200 cursor-pointer hover:opacity-90";
                    img.onclick = () => openLightbox(src);
                    gallery.appendChild(img);
                });
            } else {
                galleryContainer.classList.add('hidden');
            }

            const grid = document.getElementById('modal-details-grid');
            grid.innerHTML = '';
            
            if (type === 'file') {
                if (item.region) grid.innerHTML += `<div><span class="text-gray-500 text-xs">منطقه:</span> <p class="font-bold text-navy-900">${item.region}</p></div>`;
                if (item.price) grid.innerHTML += `<div><span class="text-gray-500 text-xs">قیمت کل:</span> <p class="font-bold text-gold-600">${item.price} تومان</p></div>`;
                if (item.priceRent) grid.innerHTML += `<div><span class="text-gray-500 text-xs">رهن:</span> <p class="font-bold text-navy-900">${item.priceRent} تومان</p></div>`;
                if (item.priceRentVal) grid.innerHTML += `<div><span class="text-gray-500 text-xs">اجاره:</span> <p class="font-bold text-navy-900">${item.priceRentVal} تومان</p></div>`;
                if (item.area) grid.innerHTML += `<div><span class="text-gray-500 text-xs">متراژ:</span> <p class="font-bold text-navy-900">${item.area} متر</p></div>`;
                if (item.floor) grid.innerHTML += `<div><span class="text-gray-500 text-xs">طبقه:</span> <p class="font-bold text-navy-900">${item.floor}</p></div>`;
            } else {
                if (item.region) grid.innerHTML += `<div><span class="text-gray-500 text-xs">منطقه درخواستی:</span> <p class="font-bold text-navy-900">${item.region}</p></div>`;
                if (item.budget) grid.innerHTML += `<div><span class="text-gray-500 text-xs">بودجه:</span> <p class="font-bold text-gold-600">${item.budget} تومان</p></div>`;
            }

            const descContainer = document.getElementById('modal-desc-container');
            if (item.desc) {
                descContainer.classList.remove('hidden');
                document.getElementById('modal-desc').innerText = item.desc;
            } else {
                descContainer.classList.add('hidden');
            }

            const locContainer = document.getElementById('modal-location-container');
            if (item.region) {
                locContainer.classList.remove('hidden');
                document.getElementById('modal-map-btn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('املاک قدس ' + item.region)}`;
            } else {
                locContainer.classList.add('hidden');
            }

            const adminBox = document.getElementById('modal-admin-box');
            if (appState.isAdmin) {
                adminBox.classList.remove('hidden');
                if (type === 'file') {
                    document.getElementById('modal-admin-owner').innerText = `مالک: ${item.ownerName || 'ثبت نشده'}`;
                    document.getElementById('modal-admin-phone').innerText = `تلفن مالک: ${item.ownerPhone || 'ثبت نشده'}`;
                    document.getElementById('modal-admin-address').innerText = `آدرس دقیق: ${item.addressExact || 'ثبت نشده'}`;
                } else {
                    document.getElementById('modal-admin-owner').innerText = `مشتری: ${item.clientName || 'ثبت نشده'}`;
                    document.getElementById('modal-admin-phone').innerText = `تلفن مشتری: ${item.clientPhone || 'ثبت نشده'}`;
                    document.getElementById('modal-admin-address').innerText = '';
                }
            } else {
                adminBox.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `amlak_ghods_backup_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }
    </script>
</body>
</html>
