<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه تخصصی املاک قدس</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0B192C',
                            900: '#030A16',
                            700: '#1E3E62',
                        },
                        gold: {
                            400: '#F3C623',
                            500: '#E5B80B',
                            600: '#B89000',
                            100: '#FFF9E6',
                        }
                    },
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #030A16;
            color: #F3F4F6;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #F3C623 0%, #B89000 100%);
        }
        .gold-text-gradient {
            background: linear-gradient(135deg, #FFF0B3 0%, #F3C623 50%, #B89000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .navy-card {
            background: rgba(11, 25, 44, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(243, 198, 35, 0.15);
        }
        .navy-card:hover {
            border-color: rgba(243, 198, 35, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #030A16;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1E3E62;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #F3C623;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #F3C623 0%, #B89000 100%);
            color: #030A16;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-navy-900 text-gray-100 min-h-screen flex flex-col custom-scrollbar">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 left-5 z-50 flex flex-col gap-3"></div>

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-navy-800/90 backdrop-blur-md border-b border-gold-500/20 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo & Title -->
            <div class="flex items-center space-x-3 space-x-reverse cursor-pointer select-none" id="brand-logo" onclick="handleLogoClick()">
                <div class="w-12 h-12 rounded-xl gold-gradient flex items-center justify-center shadow-lg shadow-gold-500/10">
                    <i class="fa-solid fa-building-columns text-navy-900 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold gold-text-gradient tracking-tight">املاک تخصصی قدس</h1>
                    <p class="text-xs text-gray-400">سامانه هوشمند خریدار، فروش و اجاره</p>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <nav class="hidden md:flex items-center space-x-1 space-x-reverse bg-navy-900/60 p-1.5 rounded-2xl border border-gold-500/10">
                <button onclick="switchTab('properties')" id="tab-btn-properties" class="tab-btn active px-5 py-2.5 rounded-xl transition-all duration-300 text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-city"></i>
                    فایل‌های املاک
                </button>
                <button onclick="switchTab('requests')" id="tab-btn-requests" class="tab-btn px-5 py-2.5 rounded-xl transition-all duration-300 text-sm font-medium text-gray-300 hover:text-white flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-list"></i>
                    درخواست‌های مشتریان
                </button>
            </nav>

            <!-- Actions -->
            <div class="flex items-center gap-3">
                <button onclick="openModal('add-property-modal')" class="gold-gradient text-navy-900 font-bold px-4 py-2.5 rounded-xl hover:opacity-95 transition flex items-center gap-2 text-sm shadow-md shadow-gold-500/20">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>ثبت ملک / درخواست</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Filters & Search Section -->
        <div class="navy-card p-5 rounded-2xl mb-8 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-1">
                    <label class="block text-xs text-gray-400 mb-1.5 font-medium">جستجو</label>
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-gray-400 text-sm"></i>
                        <input type="text" id="search-input" oninput="applyFilters()" placeholder="عنوان، منطقه، شناسه..." class="w-full bg-navy-900/80 border border-gold-500/20 rounded-xl pr-10 pl-4 py-2.5 text-sm focus:outline-none focus:border-gold-500 text-white placeholder-gray-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-medium">نوع معامله</label>
                    <select id="filter-deal-type" onchange="applyFilters()" class="w-full bg-navy-900/80 border border-gold-500/20 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-gold-500 text-white transition">
                        <option value="all">همه معامله‌ها</option>
                        <option value="فروش">فروش</option>
                        <option value="خرید">خرید (متقاضی)</option>
                        <option value="رهن و اجاره">رهن و اجاره</option>
                        <option value="پیش‌فروش">پیش‌فروش</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-medium">نوع ملک</label>
                    <select id="filter-property-type" onchange="applyFilters()" class="w-full bg-navy-900/80 border border-gold-500/20 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-gold-500 text-white transition">
                        <option value="all">همه انواع ملک</option>
                        <option value="آپارتمان">آپارتمان</option>
                        <option value="ویلایی">ویلایی / خانه</option>
                        <option value="زمین">زمین / کلنگی</option>
                        <option value="تجاری">تجاری / مغازه</option>
                        <option value="اداری">اداری / دفتر کار</option>
                        <option value="باغ">باغ / ویلا</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-medium">مرتب‌سازی</label>
                    <select id="filter-sort" onchange="applyFilters()" class="w-full bg-navy-900/80 border border-gold-500/20 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-gold-500 text-white transition">
                        <option value="newest">جدیدترین</option>
                        <option value="price-asc">کمترین قیمت</option>
                        <option value="price-desc">بیشترین قیمت</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- View Tabs Content -->
        <div id="properties-view" class="space-y-6">
            <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will render dynamically -->
            </div>
            <div id="no-properties" class="hidden text-center py-16 bg-navy-800/40 rounded-2xl border border-dashed border-gray-700">
                <i class="fa-solid fa-house-circle-xmark text-5xl text-gray-600 mb-3"></i>
                <p class="text-gray-400 font-medium">هیچ ملکی با این مشخصات یافت نشد.</p>
            </div>
        </div>

        <div id="requests-view" class="space-y-6 hidden">
            <div id="requests-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Requests cards dynamically rendered -->
            </div>
            <div id="no-requests" class="hidden text-center py-16 bg-navy-800/40 rounded-2xl border border-dashed border-gray-700">
                <i class="fa-solid fa-folder-open text-5xl text-gray-600 mb-3"></i>
                <p class="text-gray-400 font-medium">هیچ درخواستی ثبت نشده است.</p>
            </div>
        </div>
    </main>

    <!-- Modal: Add Property / Request -->
    <div id="add-property-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-navy-800 border border-gold-500/30 w-full max-w-2xl rounded-2xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-gold-500/20 flex justify-between items-center bg-navy-900/50">
                <h3 class="text-lg font-bold gold-text-gradient flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-gold-500"></i>
                    ثبت فایل یا درخواست جدید
                </h3>
                <button onclick="closeModal('add-property-modal')" class="text-gray-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="property-form" onsubmit="handleFormSubmit(event)" class="p-6 overflow-y-auto space-y-4 custom-scrollbar">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">نوع معامله *</label>
                        <select id="form-deal-type" required onchange="toggleFormFields()" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                            <option value="فروش">فروش (سپردن ملک)</option>
                            <option value="خرید">خرید (متقاضی / خریدار)</option>
                            <option value="رهن و اجاره">رهن و اجاره</option>
                            <option value="پیش‌فروش">پیش‌فروش</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-300 mb-1">نوع ملک مورد نظر *</label>
                        <select id="form-property-type" required class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                            <option value="آپارتمان">آپارتمان</option>
                            <option value="ویلایی">ویلایی / خانه</option>
                            <option value="زمین">زمین / کلنگی</option>
                            <option value="تجاری">تجاری / مغازه</option>
                            <option value="اداری">اداری / دفتر کار</option>
                            <option value="باغ">باغ / ویلا</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">عنوان فایل / درخواست *</label>
                    <input type="text" id="form-title" required placeholder="مثال: آپارتمان ۱۲۰ متری نوساز یا خریدار خانه ویلایی" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">منطقه / آدرس *</label>
                        <input type="text" id="form-location" required placeholder="مثال: خیابان امام، محدوده قدس" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">متراژ (مترمربع)</label>
                        <input type="number" id="form-area" placeholder="100" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="price-container">
                    <div id="main-price-field">
                        <label id="price-label" class="block text-xs text-gray-300 mb-1">قیمت کل (تومان)</label>
                        <input type="text" id="form-price" placeholder="مثال: 2,500,000,000" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                    <div id="rent-price-field" class="hidden">
                        <label class="block text-xs text-gray-300 mb-1">اجاره ماهانه (تومان)</label>
                        <input type="text" id="form-rent" placeholder="مثال: 5,000,000" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">نام متقاضی / مالک *</label>
                        <input type="text" id="form-owner-name" required placeholder="نام و نام خانوادگی" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-300 mb-1">شماره تماس *</label>
                        <input type="tel" id="form-owner-phone" required placeholder="09123456789" class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-300 mb-1">توضیحات و امکانات تکمیلی</label>
                    <textarea id="form-description" rows="3" placeholder="توضیحات کامل درباره امکانات، شرایط معامله و ..." class="w-full bg-navy-900 border border-gold-500/20 rounded-xl p-2.5 text-sm focus:border-gold-500 text-white"></textarea>
                </div>

                <div class="pt-4 border-t border-gold-500/20 flex gap-3 justify-end">
                    <button type="button" onclick="closeModal('add-property-modal')" class="px-5 py-2.5 rounded-xl border border-gray-600 text-gray-300 hover:bg-gray-800 text-sm">انصراف</button>
                    <button type="submit" class="gold-gradient text-navy-900 font-bold px-6 py-2.5 rounded-xl text-sm hover:opacity-95 shadow-md shadow-gold-500/20">ثبت اطلاعات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Block -->
    <script>
        // Database simulation using LocalStorage
        let items = JSON.parse(localStorage.getItem('ghods_properties')) || [
            {
                id: '101',
                dealType: 'فروش',
                propertyType: 'آپارتمان',
                title: 'آپارتمان ۱۴۰ متری تک‌واحدی نوساز',
                location: 'خیابان قدس، کوچه بهار',
                area: '140',
                price: '4,200,000,000',
                rent: '',
                ownerName: 'آقای رضایی',
                ownerPhone: '09121111111',
                description: 'سه خوابه، فول امکانات، آسانسور، پارکینگ، انبار، نورگیر عالی',
                date: new Date().toLocaleDateString('fa-IR')
            },
            {
                id: '102',
                dealType: 'خرید',
                propertyType: 'ویلایی',
                title: 'متقاضی خرید ویلایی متراژ بالا',
                location: 'محدوده شهرک قدس',
                area: '250',
                price: '8,000,000,000',
                rent: '',
                ownerName: 'دکتر علوی',
                ownerPhone: '09122222222',
                description: 'خریدار واقعی ملک ویلایی شمالی یا جنوبی با سند شش‌دانگ',
                date: new Date().toLocaleDateString('fa-IR')
            }
        ];

        let logoClickCounter = 0;

        function saveItems() {
            localStorage.setItem('ghods_properties', JSON.stringify(items));
        }

        function switchTab(tab) {
            const propBtn = document.getElementById('tab-btn-properties');
            const reqBtn = document.getElementById('tab-btn-requests');
            const propView = document.getElementById('properties-view');
            const reqView = document.getElementById('requests-view');

            if (tab === 'properties') {
                propBtn.classList.add('active');
                reqBtn.classList.remove('active');
                propView.classList.remove('hidden');
                reqView.classList.add('hidden');
            } else {
                reqBtn.classList.add('active');
                propBtn.classList.remove('active');
                reqView.classList.remove('hidden');
                propView.classList.add('hidden');
            }
            applyFilters();
        }

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function toggleFormFields() {
            const dealType = document.getElementById('form-deal-type').value;
            const priceLabel = document.getElementById('price-label');
            const rentField = document.getElementById('rent-price-field');

            if (dealType === 'رهن و اجاره') {
                priceLabel.textContent = 'مبلغ رهن (تومان)';
                rentField.classList.remove('hidden');
            } else if (dealType === 'خرید') {
                priceLabel.textContent = 'حداکثر بودجه (تومان)';
                rentField.classList.add('hidden');
            } else {
                priceLabel.textContent = 'قیمت کل (تومان)';
                rentField.classList.add('hidden');
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const newItem = {
                id: Math.floor(100 + Math.random() * 900).toString(),
                dealType: document.getElementById('form-deal-type').value,
                propertyType: document.getElementById('form-property-type').value,
                title: document.getElementById('form-title').value,
                location: document.getElementById('form-location').value,
                area: document.getElementById('form-area').value || '-',
                price: document.getElementById('form-price').value || 'توافقی',
                rent: document.getElementById('form-rent').value || '',
                ownerName: document.getElementById('form-owner-name').value,
                ownerPhone: document.getElementById('form-owner-phone').value,
                description: document.getElementById('form-description').value || 'توضیحاتی ثبت نشده است.',
                date: new Date().toLocaleDateString('fa-IR')
            };

            items.unshift(newItem);
            saveItems();
            closeModal('add-property-modal');
            document.getElementById('property-form').reset();
            showToast('اطلاعات با موفقیت در سیستم ثبت گردید.');
            applyFilters();
        }

        function renderCards(filteredItems) {
            const propGrid = document.getElementById('properties-grid');
            const reqGrid = document.getElementById('requests-grid');
            const noProp = document.getElementById('no-properties');
            const noReq = document.getElementById('no-requests');

            propGrid.innerHTML = '';
            reqGrid.innerHTML = '';

            const properties = filteredItems.filter(i => i.dealType !== 'خرید');
            const requests = filteredItems.filter(i => i.dealType === 'خرید');

            // Render Properties
            if (properties.length === 0) {
                noProp.classList.remove('hidden');
            } else {
                noProp.classList.add('hidden');
                properties.forEach(item => {
                    propGrid.innerHTML += createCardHTML(item);
                });
            }

            // Render Requests
            if (requests.length === 0) {
                noReq.classList.remove('hidden');
            } else {
                noReq.classList.add('hidden');
                requests.forEach(item => {
                    reqGrid.innerHTML += createCardHTML(item);
                });
            }
        }

        function createCardHTML(item) {
            const isRequest = item.dealType === 'خرید';
            const badgeColor = isRequest ? 'bg-blue-500/20 text-blue-300 border-blue-500/30' : 'bg-gold-500/20 text-gold-400 border-gold-500/30';
            
            return `
                <div class="navy-card rounded-2xl p-5 shadow-lg flex flex-col justify-between transition duration-300 hover:-translate-y-1">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-3">
                            <span class="text-xs px-2.5 py-1 rounded-lg border font-medium ${badgeColor}">
                                ${item.dealType}
                            </span>
                            <span class="text-xs text-gray-400 flex items-center gap-1">
                                <i class="fa-solid fa-building text-gold-500"></i>
                                ${item.propertyType}
                            </span>
                        </div>

                        <h4 class="font-bold text-white text-base mb-2 line-clamp-1">${item.title}</h4>
                        
                        <p class="text-xs text-gray-400 mb-4 flex items-center gap-1.5">
                            <i class="fa-solid fa-location-dot text-red-400"></i>
                            ${item.location}
                        </p>

                        <div class="bg-navy-900/80 rounded-xl p-3 border border-gold-500/10 space-y-2 mb-4 text-xs">
                            <div class="flex justify-between text-gray-300">
                                <span>متراژ:</span>
                                <span class="font-bold text-white">${item.area} متر</span>
                            </div>
                            <div class="flex justify-between text-gray-300">
                                <span>${item.dealType === 'رهن و اجاره' ? 'مبلغ رهن:' : (isRequest ? 'بودجه:' : 'قیمت:')}</span>
                                <span class="font-bold text-gold-400">${item.price} تومان</span>
                            </div>
                            ${item.rent ? `
                            <div class="flex justify-between text-gray-300">
                                <span>اجاره ماهانه:</span>
                                <span class="font-bold text-gold-400">${item.rent} تومان</span>
                            </div>` : ''}
                        </div>

                        <p class="text-xs text-gray-400 line-clamp-2 mb-4 leading-relaxed">${item.description}</p>
                    </div>

                    <div class="pt-3 border-t border-gold-500/10 flex items-center justify-between text-xs">
                        <div class="text-gray-400">
                            <i class="fa-solid fa-user text-gold-500 ml-1"></i>
                            ${item.ownerName}
                        </div>
                        <a href="tel:${item.ownerPhone}" class="gold-gradient text-navy-900 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
                            <i class="fa-solid fa-phone"></i>
                            تماس
                        </a>
                    </div>
                </div>
            `;
        }

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const dealType = document.getElementById('filter-deal-type').value;
            const propertyType = document.getElementById('filter-property-type').value;

            let filtered = items.filter(item => {
                const matchQuery = item.title.toLowerCase().includes(query) || 
                                   item.location.toLowerCase().includes(query) || 
                                   item.id.includes(query);
                const matchDeal = dealType === 'all' || item.dealType === dealType;
                const matchType = propertyType === 'all' || item.propertyType === propertyType;

                return matchQuery && matchDeal && matchType;
            });

            renderCards(filtered);
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-navy-800 border-r-4 border-gold-500 text-white px-4 py-3 rounded-xl shadow-xl text-xs flex items-center gap-2 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-gold-500 text-sm"></i> ${msg}`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function handleLogoClick() {
            logoClickCounter++;
            if (logoClickCounter === 5) {
                showToast('پنل مدیریت مخفی فعال گردید.');
                logoClickCounter = 0;
            }
        }

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            applyFilters();
        });
    </script>
</body>
</html>
