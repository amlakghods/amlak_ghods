<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور املاک قدس (کریمی) - اراک</title>
  
  <!-- فونت فارسی وزیر متن - برای فونت شیک و خوانا -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  
  <style>
    /* ۱. استایل کلی و رنگ زمینه کرم شیک */
    body {
      background-color: #f9f6f0; /* رنگ کرم روشن مطابق تصویر */
      color: #2c2c2c;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      direction: rtl;
    }

    /* ۲. استایل هدر بالای صفحه */
    .main-header {
      background-color: #ffffff;
      border-bottom: 2px solid #e0d8c8;
      padding: 1rem 2rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    /* ۳. جایگاه لوگو (تصویر لوگوی خاص از روی عکس) */
    .logo-container {
      width: 80px;  /* اندازه بزرگتر برای دیده شدن جزئیات */
      height: 80px;
      border-radius: 50%;
      overflow: hidden; /* برش دایره‌ای */
      background-color: #121212; /* پس‌زمینه مشکی */
      border: 3px solid #ff6b00; /* حاشیه نارنجی مطابق عکس */
      box-shadow: 0 4px 10px rgba(255, 107, 0, 0.2);
      flex-shrink: 0;
    }

    /* !!! مهم: شما باید عکس لوگوی خودتان را جایگزین کنید !!! */
    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* حفظ تناسب عکس */
      /* نکته: اگر لوگو پس‌زمینه مشکی دارد، مستقیماً از روی عکس برش دهید و اینجا قرار دهید */
    }

    /* ۴. متون هدر با فونت و رنگ سرمه‌ای */
    .header-titles {
      color: #0c173c; /* رنگ سرمه‌ای مطابق عکس */
    }

    .header-titles h1 {
      margin: 0;
      font-size: 1.8rem; /* فونت بزرگ و شیک */
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-titles p {
      margin: 0.3rem 0 0 0;
      font-size: 1.1rem;
      color: #0c173c;
      font-weight: 500;
    }

    /* محتوای اصلی صفحه */
    .main-content {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
  </style>
</head>
<body>

  <!-- هدر اصلی -->
  <header class="main-header">
    <div class="header-container">
      
      <!-- ۱. جایگاه لوگو: تصویر لوگوی خاص مشکی با حرف K و خطوط نارنجی -->
      <div class="logo-container">
        <!-- شما باید فایل لوگوی خودتان را با فرمت .png یا .jpg در اینجا قرار دهید -->
        <!-- مثلاً فایل را برش دهید و نام آن را logo.png بگذارید -->
        <img src="logo.png" alt="لوگوی املاک قدس">
      </div>

      <!-- ۲. عناوین هدر با فونت شیک -->
      <div class="header-titles">
        <h1>مشاور املاک قدس (کریمی)</h1>
        <p>سامانه جامع و آنلاین املاک شهر اراک</p>
      </div>

    </div>
  </header>

  <!-- بخش محتوا (در گام‌های بعدی تکمیل می‌شود) -->
  <main class="main-content">
  </main>

</body>
</html>
