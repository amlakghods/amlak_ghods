<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور املاک قدس (کریمی)</title>

  <!-- بارگذاری فونت‌های نستعلیق و وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-nastaliq@v2.0.0/iran-nastaliq.css" rel="stylesheet">

  <style>
    /* پس‌زمینه کرم روشن مطابق تصویر */
    body {
      background-color: #f3ece0;
      margin: 0;
      padding: 0;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
    }

    /* بخش سربرگ (هدر) */
    .site-header {
      background-color: #f3ece0;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #e0d5c3;
    }

    .header-container {
      max-width: 1000px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    /* نماد گرافیکی و ساده ساختمان */
    .building-icon-box {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .building-icon-box svg {
      width: 80px;
      height: 80px;
    }

    /* متن‌های هدر */
    .text-holder {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    /* عنوان اصلی با فونت نستعلیق و رنگ سرمه‌ای تابلوی عکس */
    .main-title {
      margin: 0;
      font-family: 'IranNastaliq', serif;
      font-size: 3.8rem;
      color: #0d233a; /* رنگ سرمه‌ای پررنگ */
      line-height: 1.3;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(13, 35, 58, 0.15);
    }

    /* زیرعنوان با فونت ضخیم و مدرن */
    .sub-title {
      margin-top: 0.2rem;
      font-size: 1.35rem;
      color: #1a1a1a;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* واکنش‌گرایی برای موبایل */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        text-align: center;
        gap: 1rem;
      }
      .text-holder {
        text-align: center;
      }
      .main-title {
        font-size: 2.8rem;
      }
      .sub-title {
        font-size: 1.1rem;
      }
      .building-icon-box {
        width: 70px;
        height: 70px;
      }
      .building-icon-box svg {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>

  <!-- سربرگ اصلی سایت -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- آیکون خطی و بسیار ساده ساختمان (سرمه‌ای و طلایی) -->
      <div class="building-icon-box">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- پایه و خط سقف -->
          <path d="M8 56H56" stroke="#0D233A" stroke-width="3.5" stroke-linecap="round"/>
          <!-- برج و سقف شیب‌دار اصلی -->
          <path d="M20 56V26L32 16L44 26V56" stroke="#0D233A" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M12 34L20 27" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M52 34L44 27" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round"/>
          <!-- پنجره‌ها -->
          <rect x="26" y="30" width="4" height="6" fill="#FF7A00"/>
          <rect x="34" y="30" width="4" height="6" fill="#FF7A00"/>
          <rect x="26" y="40" width="4" height="6" fill="#FF7A00"/>
          <rect x="34" y="40" width="4" height="6" fill="#FF7A00"/>
          <!-- درب ورودی -->
          <path d="M28 56V49H36V56" fill="#0D233A"/>
        </svg>
      </div>

      <!-- نوشته‌ها با فونت نستعلیق و کیفیت بالا -->
      <div class="text-holder">
        <h1 class="main-title">مشاور املاک قدس (کریمی)</h1>
        <div class="sub-title">سامانه جامع و آنلاین املاک شهر اراک</div>
      </div>

    </div>
  </header>

</body>
</html>
