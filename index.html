<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور املاک قدس (کریمی)</title>

  <!-- بارگذاری فونت‌های دقیق نستعلیق و وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Vazirmatn:wght@600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/iran-nastaliq@v2.0.0/iran-nastaliq.css" rel="stylesheet">

  <style>
    /* پس‌زمینه کرم دقیق دیوار در تصویر */
    body {
      background-color: #f3ece0;
      margin: 0;
      padding: 0;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
    }

    /* استایل کل بخش سربرگ (هدر) */
    .site-header {
      background-color: #f3ece0;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid #e0d5c3;
    }

    .header-container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    /* جایگاه دایره لوگو */
    .logo-holder {
      width: 140px;
      height: 140px;
      background-color: #121212;
      border-radius: 50%;
      border: 3px solid #ff7a00;
      box-shadow: 0 0 25px rgba(255, 122, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-holder svg {
      width: 95px;
      height: 95px;
    }

    /* بخش متن‌های تابلوی سربرگ */
    .text-holder {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    /* ۱. عنوان اصلی با خط نستعلیق و رنگ سرمه‌ای پررنگ تابلوی تصویر */
    .main-title {
      margin: 0;
      font-family: 'IranNastaliq', 'Aref Ruqaa', serif;
      font-size: 3.8rem;
      color: #0d233a; /* رنگ سرمه‌ای تابلوی عکس */
      line-height: 1.3;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(13, 35, 58, 0.15);
    }

    /* ۲. زیرعنوان دقیقاً با فونت ضخیم و مدرن مشکی‌رنگ */
    .sub-title {
      margin-top: 0.2rem;
      font-size: 1.35rem;
      color: #1a1a1a;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* تنظیمات واکنش‌گرایی برای موبایل */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        text-align: center;
        gap: 1.2rem;
      }
      .text-holder {
        text-align: center;
      }
      .main-title {
        font-size: 2.8rem;
      }
      .sub-title {
        font-size: 1.1rem;
      }
      .logo-holder {
        width: 110px;
        height: 110px;
      }
      .logo-holder svg {
        width: 75px;
        height: 75px;
      }
    }
  </style>
</head>
<body>

  <!-- سربرگ اصلی سایت -->
  <header class="site-header">
    <div class="header-container">
      
      <!-- دایره لوگوی مشکی و نارنجی -->
      <div class="logo-holder">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 18 L68 32 V78 H58 V48 H42 V78 H32 V32 L50 18 Z" stroke="#FF7A00" stroke-width="3" stroke-linejoin="round"/>
          <path d="M50 26 L60 34 V70 H54 V52 H46 V70 H40 V34 L50 26 Z" stroke="#FF7A00" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M22 55 L38 42 L50 52" stroke="#FF7A00" stroke-width="3" stroke-linecap="round"/>
          <path d="M78 55 L62 42 L50 52" stroke="#FF7A00" stroke-width="3" stroke-linecap="round"/>
          <path d="M38 52 V78" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M62 52 L39 65 L62 78" stroke="#FF7A00" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 78 H82" stroke="#FF7A00" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- نوشته‌های سربرگ دقیقا طبق تصویر -->
      <div class="text-holder">
        <h1 class="main-title">مشاور املاک قدس (کریمی)</h1>
        <div class="sub-title">سامانه جامع و آنلاین املاک شهر اراک</div>
      </div>

    </div>
  </header>

</body>
</html>
