<style>
:root{
  --bg:#F7F1E3; --surface:#FFFBF2; --ink:#0E3A66; --ink-soft:#1B4A7A;
  --line:#E1E5EA; --blue:#0E3A66; --blue-deep:#092747; --gold:#D9B65C; --gold-deep:#B8943A;
  --danger:#B4483A; --green:#2E9E5B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{height:100%;}
body{min-height:100%;display:flex;flex-direction:column;}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:'Vazirmatn',sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;}
header{position:relative;z-index:10;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 6px;
  background:linear-gradient(135deg,#F3E9D4,#EADFC4);color:var(--blue);border-bottom:3px solid var(--blue);
  display:flex; align-items:center; gap:12px;}
header .building-icon{flex:0 0 auto; width:42px; height:42px; filter:drop-shadow(0 3px 6px rgba(14,58,102,.3));}
header .header-text{flex:1; min-width:0;}
header h1{margin:0;font-size:22px;font-weight:400;color:var(--blue);font-family:'Lalezar','Vazirmatn',sans-serif;line-height:1.35;letter-spacing:0;text-shadow:1.5px 1.5px 0 var(--gold);}
header p{margin:0;font-size:11.5px;color:var(--blue);}
header p.tagline{font-weight:600;}
nav{display:flex;gap:6px;padding:6px 12px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);}
nav button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink-soft);padding:9px 16px;border-radius:100px;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;}
nav button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
nav button{display:flex; flex-direction:column; align-items:center; line-height:1.3;}
.nav-sub{font-size:10px; font-weight:400; opacity:0.75; margin-top:1px;}
main{max-width:640px;width:100%;margin:0 auto;padding:18px;flex:1 0 auto;}
.site-foot{max-width:640px;margin:0 auto;padding:12px 18px calc(96px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;line-height:1.7;color:var(--ink-soft);}
.view{display:none;} .view.active{display:block;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px rgba(0,0,0,.05);}
h2{font-size:17px;margin:0 0 4px;position:relative;padding-bottom:10px;}
h2::after{content:'';position:absolute;right:0;bottom:0;width:36px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-deep));}
.hint{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}
.field-help{color:var(--ink-soft);font-size:12px;margin:4px 2px 0;line-height:1.4;}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
label:first-of-type{margin-top:0;}
select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px;}
textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dims-row{display:flex;align-items:center;gap:8px;}
.dims-row input{text-align:center;}
.dims-x{font-weight:700;color:var(--ink-soft);font-size:15px;}
.btn{width:100%;padding:12px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-family:inherit;font-size:15px;font-weight:600;margin-top:18px;cursor:pointer;}
.btn:active{background:var(--blue-deep);}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.gold{background:var(--gold);color:var(--blue);}
::placeholder{color:#0E3A66;opacity:.45;}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.photos img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.list-item{border-bottom:1px solid var(--line);padding:12px 0;display:flex;gap:12px;cursor:pointer;}
.list-item:last-child{border-bottom:none;}
.list-item img,.thumb-wrap img{width:64px;height:64px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--line);display:block;}
.thumb-wrap{position:relative;flex:0 0 auto;}
.photo-badge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px;}
.list-item .meta{flex:1;min-width:0;}
.list-item .meta strong{display:block;font-size:14.5px;}
.list-item .meta span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:100px;background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);margin-top:4px;}
.code-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:100px;background:rgba(14,58,102,.08);color:var(--blue);margin-top:4px;direction:ltr;}
.share-btn{display:block;margin-top:8px;padding:7px 12px;border:1px solid var(--green);color:var(--blue);background:transparent;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.share-btn:active{background:var(--green);color:#fff;}
.tel-link,.map-link{color:var(--blue);text-decoration:none;font-weight:700;}
.tel-link{direction:ltr;unicode-bidi:embed;display:inline-block;}
.count-badge{display:inline-block;font-size:12px;font-weight:600;color:var(--blue);background:rgba(14,58,102,.08);padding:2px 10px;border-radius:100px;vertical-align:middle;margin-right:6px;}
.empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:30px 10px;}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:100px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.toast.show{opacity:1;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal-box{background:var(--surface);border-radius:14px;padding:20px;width:100%;max-width:340px;text-align:center;max-height:88vh;overflow-y:auto;}
.modal-box.wide{max-width:480px;text-align:right;}
.modal-box h3{margin:0 0 4px;font-size:16px;}
.modal-box input{margin-top:12px;text-align:center;letter-spacing:3px;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.modal-actions .btn{flex:1;}
.modal-error{color:var(--danger);font-size:12.5px;margin-top:10px;}
.modal-close{position:sticky;top:0;float:left;background:var(--bg);border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-family:inherit;}
.detail-photos img{width:100%;border-radius:10px;margin-bottom:8px;}
.detail-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:13.5px;}
.detail-row b{color:var(--ink-soft);font-weight:500;}
.note{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);margin-top:14px;}
.search-box{margin-bottom:10px;}

#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#14508C,#092747 70%);transition:opacity .6s ease;}
#splash.hide{opacity:0;pointer-events:none;}
#splash svg{width:min(78vw,320px);height:auto;overflow:visible;}
.sp-build{animation:spRise 1s ease-out both;}
@keyframes spRise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sp-win{fill:#1D4D80;animation:spLight .5s ease forwards;}
@keyframes spLight{to{fill:#F0D98A}}
.sp-title{font-family:'Lalezar','Vazirmatn',sans-serif;color:#F0D98A;font-size:30px;line-height:1.4;margin-top:16px;text-align:center;animation:spFade .8s .9s both;}
.sp-sub{color:#fff;opacity:.85;font-size:13px;margin-top:2px;animation:spFade .8s 1.2s both;}
@keyframes spFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* --- property cards --- */
.prop-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;cursor:pointer;background:var(--surface);box-shadow:0 2px 10px rgba(14,58,102,.08);}
.prop-card:last-child{margin-bottom:0;}
.prop-img{position:relative;height:180px;background:var(--line);}
.prop-img img{width:100%;height:100%;object-fit:cover;display:block;}
.prop-noimg{height:100%;display:flex;align-items:center;justify-content:center;font-size:46px;background:linear-gradient(135deg,#EADFC4,#F3E9D4);}
.prop-badge{position:absolute;top:10px;right:10px;color:#fff;font-size:12px;font-weight:600;padding:3px 13px;border-radius:100px;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.b-sale{background:var(--blue);} .b-rent{background:var(--green);} .b-part{background:var(--gold-deep);}
.prop-img .photo-badge{bottom:10px;left:10px;font-size:11px;padding:2px 9px;}
.prop-body{padding:12px 14px 14px;}
.prop-title{font-size:15.5px;font-weight:700;}
.prop-price{font-size:17px;font-weight:700;color:#9A7420;margin:4px 0;}
.prop-spec{font-size:12.5px;color:var(--ink-soft);line-height:1.8;}
/* --- step choices --- */
.choice-grid{display:grid;gap:10px;margin-top:6px;}
.choice-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--blue);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;text-align:right;}
.choice-btn:active{background:rgba(14,58,102,.1);border-color:var(--blue);}
.choice-summary{display:flex;justify-content:space-between;align-items:center;background:rgba(14,58,102,.07);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-weight:700;color:var(--blue);font-size:14px;}
.choice-summary button{border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:8px;padding:4px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}

#bgMove{position:absolute;inset:0;transform:translate3d(0,0,0) scale(1.05);will-change:transform;}
#bgImg,.bgFill{position:absolute;opacity:0;transition:opacity .8s ease;background-image:var(--bgurl);background-repeat:no-repeat;}
#bgPhoto.ready #bgImg,#bgPhoto.ready .bgFill{opacity:1;}
/* soft full-screen copy of the same photo behind, sharp un-cropped photo on top */
#bgFillA{inset:-4%;background-size:cover;background-position:50% 55%;filter:blur(10px) brightness(1.02);}
#bgFillB{display:none;}
#bgImg{inset:0;background-size:contain;background-position:50% 50%;-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 78%,transparent 100%);}
#bgPhoto::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,27,51,.06) 0%,rgba(6,27,51,.0) 40%,rgba(6,27,51,.38) 100%);}
nav,main,.site-foot{position:relative;z-index:1;}
.site-foot{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.65);}
/* --- code + favorite --- */
.prop-code{position:absolute;top:10px;left:10px;background:rgba(14,58,102,.88);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:100px;direction:ltr;letter-spacing:.5px;}
.fav-btn{position:absolute;bottom:10px;right:10px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.93);color:var(--blue);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:0;}
.fav-btn.on{color:#D6334A;}
.fav-row{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;padding:9px 12px;border:1px solid var(--line);background:transparent;border-radius:10px;font-family:inherit;color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;}
.fav-row .fav-ic{font-size:20px;line-height:1;}
.fav-row.on{background:rgba(214,51,74,.08);border-color:#D6334A;}
.fav-row.on .fav-ic{color:#D6334A;}
.fav-row:active{transform:scale(.98);}
.fav-btn:active{transform:scale(.9);}
/* --- quick contact bar --- */
#quickBar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,251,242,.96);border-top:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.qb{flex:1;text-align:center;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;}
.qb.call{background:var(--blue);} .qb.wa{background:var(--green);}
/* nav sticks to the top of the screen while scrolling */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 2px 10px rgba(14,58,102,.12);}

/* ================= BLACK & GOLD THEME ================= */
:root{--bg:#1c1c22;--surface:#26262d;--ink:#FBF3DE;--ink-soft:#E3D3A6;--line:#453c27;--blue:#E3C46E;--blue-deep:#C9A94F;--gold:#E3C46E;--gold-deep:#B8943A;--danger:#E0735F;}
body{background-color:#15151a;}
header{background:linear-gradient(135deg,#1f1f25,#33301f);border-bottom:3px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.5);}
header h1{color:#F0D98A;text-shadow:0 0 14px rgba(227,196,110,.35);}
header p{color:#E9D9A8;}
nav{background:rgba(32,32,38,.97);border-bottom:1px solid #4d4128;box-shadow:0 2px 14px rgba(0,0,0,.55);}
nav button{color:#D9C690;border-color:#3a3222;}
nav button.active{background:var(--gold);color:#17130a;border-color:var(--gold);}
.card{background:rgba(38,38,45,.94);border-color:#4d4128;box-shadow:0 6px 24px rgba(0,0,0,.45);}
select,input,textarea{background:#32323b;color:var(--ink);border-color:#5f5133;}
::placeholder{color:#CDBB8E;opacity:.5;}
.btn{background:linear-gradient(135deg,#F0D98A,#C9A94F);color:#17130a;}
.btn:active{background:#B8943A;}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid #4a3f28;}
.code-tag{background:rgba(227,196,110,.14);color:#F0D98A;}
.count-badge{background:rgba(227,196,110,.14);color:#F0D98A;}
.share-btn{color:#F0D98A;}
.toast{background:var(--gold);color:#17130a;}
.modal-box{background:#26262d;color:var(--ink);}
.modal-close{background:#26231b;color:var(--ink);}
.note{background:#22222a;border-color:#4d4128;}
.choice-btn{background:#32323b;border-color:#5f5133;color:#F5E3A0;}

#quickBar{background:rgba(28,28,34,.96);border-top:1px solid #4d4128;}
