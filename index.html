<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاور املاک قدس (کریمی) - اراک</title>
  
  <style>
    /* ۱. پس‌زمینه کرم دقیق مطابق تصویر */
    body {
      background-color: #f4eee0;
      margin: 0;
      padding: 0;
      direction: rtl;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ۲. ساختار هدر اصلی */
    .main-header {
      background-color: #f4eee0;
      padding: 2.5rem 1rem;
      border-bottom: 1px solid #e0d6c3;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .header-container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    /* ۳. جایگاه لوگو (بزرگ‌تر شده) */
    .logo-box {
      width: 150px; /* اندازه بزرگ‌تر */
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 122, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
      background-color: #121212;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ۴. جایگاه تصویر متن خطاطی اختصاصی */
    .brand-title-img {
      max-width: 450px; /* ابعاد بزرگ و واضح برای متن */
      height: auto;
      display: block;
    }

    /* واکنش‌گرایی برای موبایل */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        gap: 1.5rem;
      }
      .logo-box {
        width: 120px;
        height: 120px;
      }
      .brand-title-img {
        max-width: 300px;
      }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      
      <!-- لوگوی دایره‌ای مشکی بزرگ‌تر -->
      <div class="logo-box">
        <!-- فایل لوگو را با نام logo.png در کنار همین فایل قرار دهید -->
        <img src="logo.png" alt="لوگوی مشاور املاک قدس">
      </div>

      <!-- تصویر متن خطاطی شده (بدون تغییر فونت) -->
      <div>
        <!-- فایل تصویر متن خطاطی را با نام header-text.png بگذارید -->
        <img src="header-text.png" alt="مشاور املاک قدس (کریمی) - سامانه جامع و آنلاین املاک شهر اراک" class="brand-title-img">
      </div>

    </div>
  </header>

  <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
  </main>

</body>
</html>
